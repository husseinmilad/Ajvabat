name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Type check
        run: npm run lint

      - name: Build web bundle & sync Capacitor Android
        run: npm run cap:sync

      - name: Build Android APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK output
        run: |
          mkdir -p apk-out
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-out/Ajwibah-Al-Istiftaat.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ajwibah-Al-Istiftaat-APK
          path: apk-out/Ajwibah-Al-Istiftaat.apk

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-latest"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" apk-out/Ajwibah-Al-Istiftaat.apk --clobber
          else
            gh release create "$TAG" apk-out/Ajwibah-Al-Istiftaat.apk \
              --title "اجوبة‌الاستفتائات - نسخه اندروید (APK)" \
              --notes "نسخه اندروید (APK) اپلیکیشن جامع اجوبة‌الاستفتائات با تمام امکانات، جستجوی ساده و پیشرفته، نشان‌گذاری، یادداشت شخصی و اشتراک‌گذاری متنی و تصویری."
          fi
