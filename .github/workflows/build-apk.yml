name: Build Android Store Release (APK & AAB)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK and API 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK at: $SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK_ROOT" > android/local.properties

          mkdir -p "$SDK_ROOT/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK_ROOT/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK_ROOT/licenses/android-sdk-preview-license"

          SDKMANAGER=$(ls "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1 || command -v sdkmanager || true)
          if [ -n "$SDKMANAGER" ]; then
            echo "Found sdkmanager: $SDKMANAGER"
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          else
            echo "::warning::sdkmanager not found, relying on Gradle auto-download"
          fi

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Type check and search engine tests
        run: |
          npm run lint
          npx --yes tsx --test src/utils/persian.test.ts src/utils/search.test.ts

      - name: Build offline bundle and sync Capacitor Android
        run: npm run cap:sync

      - name: Prepare Release Keystore (if configured in Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/release-keystore.jks
            echo "ANDROID_KEYSTORE_PATH=/tmp/release-keystore.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "HAS_RELEASE_SIGNING=true" >> "$GITHUB_ENV"
            echo "Release signing enabled with configured GitHub Secrets."
          else
            echo "HAS_RELEASE_SIGNING=false" >> "$GITHUB_ENV"
            echo "::warning::ANDROID_KEYSTORE_* secrets are not fully configured; Release APK/AAB will be built unsigned. Add the 4 secrets to sign automatically for Cafe Bazaar and Myket."
          fi

      - name: Build Release APK, Release AAB, and Debug APK
        run: |
          VERSION_CODE=$(( ${GITHUB_RUN_NUMBER:-1} + 1 ))
          VERSION_NAME="1.1.0"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

          sed -i 's/\r$//' android/gradlew || true
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease bundleRelease assembleDebug \
            -PVERSION_CODE="$VERSION_CODE" \
            -PVERSION_NAME="$VERSION_NAME" \
            --no-daemon --stacktrace

      - name: Collect APK & AAB outputs
        run: |
          mkdir -p release-out

          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp "android/app/build/outputs/apk/release/app-release.apk" "release-out/Ajwibah-Al-Istiftaat-v${VERSION_NAME}-release.apk"
          elif [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp "android/app/build/outputs/apk/release/app-release-unsigned.apk" "release-out/Ajwibah-Al-Istiftaat-v${VERSION_NAME}-release-unsigned.apk"
          else
            echo "Release APK output not found!"
            exit 1
          fi

          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"
          test -f "$AAB_PATH"
          cp "$AAB_PATH" "release-out/Ajwibah-Al-Istiftaat-v${VERSION_NAME}-release.aab"

          DEBUG_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$DEBUG_APK"
          cp "$DEBUG_APK" "release-out/Ajwibah-Al-Istiftaat-v${VERSION_NAME}-debug.apk"

          ls -lh release-out/

      - name: Upload Store Release artifacts (APK & AAB)
        uses: actions/upload-artifact@v4
        with:
          name: Ajwibah-Al-Istiftaat-Store-Release
          path: release-out/*
          retention-days: 90

      - name: Publish to GitHub Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-latest"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-out/* --clobber
          else
            gh release create "$TAG" release-out/* \
              --title "اجوبة‌الاستفتائات - نسخه انتشار کافه‌بازار و مایکت (APK و AAB)" \
              --notes "خروجی بیلد نسخه ${VERSION_NAME} (کد نسخه ${VERSION_CODE}): شامل فایل Release APK و AAB برای انتشار در کافه‌بازار و مایکت به همراه نسخه Debug جهت آزمایش سریع."
          fi
