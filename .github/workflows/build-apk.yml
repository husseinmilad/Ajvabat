name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK and API 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK at: $SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK_ROOT" > android/local.properties

          mkdir -p "$SDK_ROOT/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK_ROOT/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK_ROOT/licenses/android-sdk-preview-license"

          SDKMANAGER=$(ls "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1 || command -v sdkmanager || true)
          if [ -n "$SDKMANAGER" ]; then
            echo "Found sdkmanager: $SDKMANAGER"
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          else
            echo "::warning::sdkmanager not found, relying on Gradle auto-download"
          fi

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Type check
        run: npm run lint

      - name: Build offline bundle and sync Capacitor Android
        run: npm run cap:sync

      - name: Build Android APK
        run: |
          sed -i 's/\r$//' android/gradlew || true
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Package APK output
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_PATH"
          mkdir -p apk-out
          cp "$APK_PATH" apk-out/Ajwibah-Al-Istiftaat.apk
          ls -lh apk-out/Ajwibah-Al-Istiftaat.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ajwibah-Al-Istiftaat-APK
          path: apk-out/Ajwibah-Al-Istiftaat.apk
          retention-days: 90

      - name: Publish APK to GitHub Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-latest"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" apk-out/Ajwibah-Al-Istiftaat.apk --clobber
          else
            gh release create "$TAG" apk-out/Ajwibah-Al-Istiftaat.apk \
              --title "اجوبة‌الاستفتائات - نسخه اندروید (APK)" \
              --notes "نسخه اندروید (APK) اپلیکیشن جامع اجوبة‌الاستفتائات با تمام امکانات، جستجوی ساده و پیشرفته، نشان‌گذاری، یادداشت شخصی و اشتراک‌گذاری متنی و تصویری."
          fi
